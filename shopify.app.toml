# AfterPulse — AI-Powered Post-Purchase Upsell App
# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5ef7968e857f71492169fffab4e38a81"
name = "AfterPulse"
application_url = "https://after-pulse.berjis.tech"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

[access_scopes]
scopes = "read_products,write_products,read_orders,write_order_edits,read_customers,write_metaobject_definitions,write_metaobjects"

[auth]
redirect_urls = [ "https://after-pulse.berjis.tech/api/auth" ]

# ─── AfterPulse Metaobjects ───

[metaobjects.app.afterpulse_settings]
name = "AfterPulse Settings"
description = "Per-shop settings for the AfterPulse upsell app"

  [metaobjects.app.afterpulse_settings.access]
  admin = "merchant_read_write"

[metaobjects.app.afterpulse_settings.fields.brand_color]
name = "Brand Color"
type = "single_line_text_field"

[metaobjects.app.afterpulse_settings.fields.accent_color]
name = "Accent Color"
type = "single_line_text_field"

[metaobjects.app.afterpulse_settings.fields.enable_ai]
name = "Enable AI"
type = "boolean"
